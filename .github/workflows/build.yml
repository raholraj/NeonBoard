name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          file NeonBoard.zip || true
          unzip -l NeonBoard.zip | head -20
          unzip -o NeonBoard.zip
          ls -la
          ls -la NeonBoard/ || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: NeonBoard
        run: |
          ls -la
          gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NeonBoard-debug-apk
          path: NeonBoard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

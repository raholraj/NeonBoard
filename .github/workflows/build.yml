name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o NeonBoard.zip
          echo "=== Project structure ==="
          ls -la NeonBoard/
          ls NeonBoard/app/src/main/java/com/neonboard/keyboard/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept licenses & install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build debug APK
        id: build
        working-directory: NeonBoard
        continue-on-error: true
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: NeonBoard/build.log

      - name: Upload APK if successful
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NeonBoard-debug-apk
          path: NeonBoard/app/build/outputs/apk/debug/app-debug.apk

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "Build failed. Check the build-log artifact."
          cat NeonBoard/build.log | tail -100
          exit 1
